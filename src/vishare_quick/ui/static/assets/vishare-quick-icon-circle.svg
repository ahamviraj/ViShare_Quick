<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="ViShare Quick" xmlns:c2pa="http://c2pa.org/manifest">
  <title>ViShare Quick</title>
  <defs>
    <clipPath id="shape"><circle cx="60" cy="60" r="60" /></clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <!-- Background -->
    <rect width="120" height="120" fill="#1e1e26" />

    <!-- Wind streaks passing in a loop -->
    <g stroke="#D9E2FF" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="20" x2="28" y2="20" opacity="0.30">
        <animateTransform attributeName="transform" type="translate" from="-40 0" to="130 0" dur="2.4s" begin="-0.4s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="36" x2="18" y2="36" opacity="0.22">
        <animateTransform attributeName="transform" type="translate" from="-40 0" to="130 0" dur="1.8s" begin="-1.2s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="52" x2="34" y2="52" opacity="0.18">
        <animateTransform attributeName="transform" type="translate" from="-40 0" to="130 0" dur="2.8s" begin="-2s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="68" x2="22" y2="68" opacity="0.28">
        <animateTransform attributeName="transform" type="translate" from="-40 0" to="130 0" dur="2s" begin="-0.8s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="84" x2="30" y2="84" opacity="0.20">
        <animateTransform attributeName="transform" type="translate" from="-40 0" to="130 0" dur="2.6s" begin="-1.6s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="100" x2="16" y2="100" opacity="0.30">
        <animateTransform attributeName="transform" type="translate" from="-40 0" to="130 0" dur="1.6s" begin="-0.2s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- "V" mark (heavier weight) -->
    <path d="M32 36 L60 84 L88 36" fill="none" stroke="#D9E2FF" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round" />

    <!-- Receive pulse at the right tip -->
    <circle cx="88" cy="36" r="4" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0">
      <animate attributeName="r" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.69;0.7;1" values="4;4;4;18" />
      <animate attributeName="opacity" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.69;0.7;1" values="0;0;0.8;0" />
    </circle>

    <!-- Trailing dot -->
    <circle r="4" fill="#314577" opacity="0">
      <animateMotion dur="1.8s" begin="0.12s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.2 1" path="M32 36 L60 84 L88 36" />
      <animate attributeName="opacity" dur="1.8s" begin="0.12s" repeatCount="indefinite" keyTimes="0;0.1;0.85;1" values="0;0.9;0.9;0" />
    </circle>

    <!-- Lead dot -->
    <circle r="6" fill="#1e1e26" opacity="0">
      <animateMotion dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.2 1" path="M32 36 L60 84 L88 36" />
      <animate attributeName="opacity" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.1;0.85;1" values="0;1;1;0" />
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
