<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="vishare-token" content="__VISHARE_TOKEN__" />
    <meta name="vishare-version" content="__VISHARE_VERSION__" />
    <title>Send files - ViShare Quick</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/vishare-quick-icon-squircle.svg"
    />
    <link rel="stylesheet" href="/styles/common.css" />
    <link rel="stylesheet" href="/styles/under-construction.css" />
  </head>
  <body data-page="send">
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>

    <button class="back-btn" type="button" data-href="index.html" aria-label="Back to main">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      <span>Main</span>
    </button>

    <h1 class="mainText">ViShare Quick</h1>

    <p class="secText subtext">You'll appear as</p>
    <div class="user-info section">
      <div class="myIcon">
        <img src="/assets/laptop.png" alt="" />
      </div>
      <div class="user-desc">
        <span class="username mainText" data-device-name>ViShare Quick</span>
        <span class="status mainText" data-device-status
          >Visible to Everyone on this network</span
        >
      </div>
    </div>

    <p class="secText subtext">
      Sorry for the inconvenience. This feature is currently under
      construction...
    </p>
    <div class="action-info section">
      <div class="under-construction">
        <div
          class="dev-anim"
          role="img"
          aria-label="This feature is under development"
        >
          <svg
            class="gears"
            viewBox="0 0 150 110"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <g transform="translate(52 52)">
              <g class="gear gear-big">
                <circle
                  r="34"
                  fill="none"
                  stroke="#D9E2FF"
                  stroke-width="10"
                  stroke-dasharray="8.9 8.9"
                />
                <circle r="29" fill="#D9E2FF" />
                <circle r="11" fill="#38393E" />
              </g>
            </g>
            <g transform="translate(112 76)">
              <g class="gear gear-small">
                <circle
                  r="22"
                  fill="none"
                  stroke="#6F8FE0"
                  stroke-width="10"
                  stroke-dasharray="8.64 8.64"
                />
                <circle r="18" fill="#6F8FE0" />
                <circle r="7" fill="#38393E" />
              </g>
            </g>
          </svg>
          <p class="dev-title mainText">
            Under Development<span class="dots"></span>
          </p>
          <div class="dev-bar"><span></span></div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
