<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="vishare-token" content="__VISHARE_TOKEN__" />
    <meta name="vishare-version" content="__VISHARE_VERSION__" />
    <title>Received file - ViShare Quick</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/vishare-quick-icon-squircle.svg"
    />
    <link rel="stylesheet" href="/styles/common.css" />
    <link rel="stylesheet" href="/styles/receive-received.css" />
  </head>
  <body data-page="received">
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>

    <button
      class="back-btn"
      type="button"
      data-action="finish"
      aria-label="Back to main"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      <span>Main</span>
    </button>

    <h1 class="mainText">ViShare Quick</h1>

    <p class="secText subtext">You'll appear as</p>
    <div class="user-info section">
      <div class="myIcon">
        <img src="/assets/laptop.png" alt="" />
      </div>
      <div class="user-desc">
        <span class="username mainText" data-device-name>ViShare Quick</span>
        <span class="status mainText" data-device-status
          >Visible to Everyone on this network</span
        >
      </div>
    </div>

    <p class="secText subtext">Sharing with you</p>
    <div class="sender-info section">
      <div class="sender-head">
        <div class="sender-icon">
          <img src="/assets/mobile.png" alt="" />
        </div>
        <div class="sender-text">
          <span class="sender-name mainText" data-result-title>Received</span>
          <span class="request-text mainText" data-result-text>Received</span>
        </div>
      </div>

      <p class="result-message mainText" data-result-message></p>

      <div class="file-info">
        <div class="file-icon">
          <img src="/assets/file.png" alt="File Icon" class="file-avatar" />
        </div>
        <div class="file-desc">
          <span class="file-name mainText" data-result-summary
            >No files were saved.</span
          >
        </div>
        <div class="progress-ring" data-result-ring>
          <img
            src="/assets/tick.png"
            width="22"
            height="22"
            alt=""
            data-result-tick
          />
          <span class="result-symbol" data-result-symbol hidden>!</span>
        </div>
      </div>

      <ul class="transfer-list result-files" data-result-files hidden></ul>

      <div class="action-buttons">
        <button class="logs-button" type="button" data-action="open-logs">
          See Logs
        </button>
        <button
          class="open-button"
          type="button"
          data-action="result-primary"
          data-primary-label
        >
          Open in Files
        </button>
      </div>
    </div>

    <div class="activity-scrim" data-action="close-logs" data-logs-scrim hidden></div>
    <aside
      class="activity-panel"
      data-logs
      role="dialog"
      aria-modal="true"
      aria-labelledby="activityTitle"
      hidden
    >
      <div class="activity-head">
        <h2 class="mainText" id="activityTitle">Activity</h2>
        <button
          class="activity-close"
          type="button"
          data-action="close-logs"
          aria-label="Close activity"
        >
          ×
        </button>
      </div>
      <p class="activity-empty" data-activity-empty>No activity yet.</p>
      <ul class="activity-list" data-activity-list></ul>
    </aside>

    <script src="/app.js"></script>
  </body>
</html>
