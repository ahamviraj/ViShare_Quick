<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="vishare-token" content="__VISHARE_TOKEN__" />
    <meta name="vishare-version" content="__VISHARE_VERSION__" />
    <title>Send failed - ViShare Quick</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/vishare-quick-icon-squircle.svg"
    />
    <link rel="stylesheet" href="/styles/common.css" />
    <link rel="stylesheet" href="/styles/send.css" />
  </head>
  <body data-page="send-failed" data-state="failed">
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>

    <button class="back-btn" type="button" data-href="index.html" aria-label="Back to main">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      <span>Main</span>
    </button>

    <h1 class="mainText">ViShare Quick</h1>

    <p class="secText subtext">You'll appear as</p>
    <div class="user-info section">
      <div class="myIcon">
        <img src="/assets/laptop.png" alt="" />
      </div>
      <div class="user-desc">
        <span class="username mainText" data-device-name>ViShare Quick</span>
        <span class="status mainText" data-send-status>Ready to send on this network</span>
      </div>
    </div>

    <div class="file-selected-info section">
      <div class="select-main">
        <div class="check-badge">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12.5l4.5 4.5L19 7.5" />
          </svg>
        </div>
        <div class="select-files">
          <span class="select-text mainText">Selected files</span>
          <span class="select-status mainText" data-send-files-status>None selected</span>
        </div>
      </div>
      <ul class="transfer-list send-file-list" data-send-file-list hidden></ul>
    </div>

    <p class="secText subtext">Send to nearby devices</p>
    <div class="file-info section">
      <div class="qr-code-main" aria-hidden="true">
        <div class="qr-code">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="QR code"
          >
            <path
              d="M6.5 6.5H6.51M17.5 6.5H17.51M6.5 17.5H6.51M13 13H13.01M17.5 17.5H17.51M17 21H21V17M14 16.5V21M21 14H16.5M15.6 10H19.4C19.9601 10 20.2401 10 20.454 9.89101C20.6422 9.79513 20.7951 9.64215 20.891 9.45399C21 9.24008 21 8.96005 21 8.4V4.6C21 4.03995 21 3.75992 20.891 3.54601C20.7951 3.35785 20.6422 3.20487 20.454 3.10899C20.2401 3 19.9601 3 19.4 3H15.6C15.0399 3 14.7599 3 14.546 3.10899C14.3578 3.20487 14.2049 3.35785 14.109 3.54601C14 3.75992 14 4.03995 14 4.6V8.4C14 8.96005 14 9.24008 14.109 9.45399C14.2049 9.64215 14.3578 9.79513 14.546 9.89101C14.7599 10 15.0399 10 15.6 10ZM4.6 10H8.4C8.96005 10 9.24008 10 9.45399 9.89101C9.64215 9.79513 9.79513 9.64215 9.89101 9.45399C10 9.24008 10 8.96005 10 8.4V4.6C10 4.03995 10 3.75992 9.89101 3.54601C9.79513 3.35785 9.64215 3.20487 9.45399 3.10899C9.24008 3 8.96005 3 8.4 3H4.6C4.03995 3 3.75992 3 3.54601 3.10899C3.35785 3.20487 3.20487 3.35785 3.10899 3.54601C3 3.75992 3 4.03995 3 4.6V8.4C3 8.96005 3 9.24008 3.10899 9.45399C3.20487 9.64215 3.35785 9.79513 3.54601 9.89101C3.75992 10 4.03995 10 4.6 10ZM4.6 21H8.4C8.96005 21 9.24008 21 9.45399 20.891C9.64215 20.7951 9.79513 20.6422 9.89101 20.454C10 20.2401 10 19.9601 10 19.4V15.6C10 15.0399 10 14.7599 9.89101 14.546C9.79513 14.3578 9.64215 14.2049 9.45399 14.109C9.24008 14 8.96005 14 8.4 14H4.6C4.03995 14 3.75992 14 3.54601 14.109C3.35785 14.2049 3.20487 14.3578 3.10899 14.546C3 14.7599 3 15.0399 3 15.6V19.4C3 19.9601 3 20.2401 3.10899 20.454C3.20487 20.6422 3.35785 20.7951 3.54601 20.891C3.75992 21 4.03995 21 4.6 21Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>

      <div class="device">
        <div class="device-avatar">
          <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
            <circle class="ring-track" cx="32" cy="32" r="29" />
            <circle class="ring-arc" cx="32" cy="32" r="29" />
          </svg>
          <div class="device-core">
            <img class="device-laptop" src="/assets/laptop.png" alt="Computer" />
            <svg
              class="device-check"
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12.5l4.5 4.5L19 7.5" />
            </svg>
            <svg
              class="device-fail"
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 7v7M12 18h.01" />
            </svg>
          </div>
        </div>
        <span class="device-name mainText" data-send-peer-name>Nearby device</span>
        <span class="device-status mainText" data-send-device-state>Failed</span>
      </div>

      <p class="send-error" data-send-error>
        The send stopped before it finished.
      </p>

      <div class="send-actions">
        <button class="accept-button" type="button" data-action="send-retry">
          Try again
        </button>
        <button class="logs-button" type="button" data-action="send-finish">
          Main
        </button>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
