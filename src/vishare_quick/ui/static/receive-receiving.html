<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="vishare-token" content="__VISHARE_TOKEN__" />
    <meta name="vishare-version" content="__VISHARE_VERSION__" />
    <title>Receiving... - ViShare Quick</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/vishare-quick-icon-squircle.svg"
    />
    <link rel="stylesheet" href="/styles/common.css" />
    <link rel="stylesheet" href="/styles/receive-receiving.css" />
  </head>
  <body data-page="receiving">
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>

    <button class="back-btn" type="button" data-href="index.html" aria-label="Back to main">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      <span>Main</span>
    </button>

    <h1 class="mainText">ViShare Quick</h1>

    <p class="secText subtext">You'll appear as</p>
    <div class="user-info section">
      <div class="myIcon">
        <img src="/assets/laptop.png" alt="" />
      </div>
      <div class="user-desc">
        <span class="username mainText" data-device-name>ViShare Quick</span>
        <span class="status mainText" data-device-status
          >Visible to Everyone on this network</span
        >
      </div>
    </div>

    <p class="secText subtext">Sharing with you</p>
    <div class="sender-info section">
      <div class="sender-head">
        <div class="sender-icon">
          <img src="/assets/mobile.png" alt="" />
        </div>
        <div class="sender-text">
          <span class="sender-name mainText">Incoming files</span>
          <span class="request-text mainText" data-progress-text
            >Receiving... 0%</span
          >
        </div>
      </div>

      <div class="file-info">
        <div class="file-icon">
          <img src="/assets/file.png" alt="File Icon" class="file-avatar" />
        </div>
        <div class="file-desc">
          <span class="file-name mainText" data-progress-summary
            >Preparing the transfer…</span
          >
        </div>
        <div
          class="progress-ring"
          data-progress-ring
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        ></div>
      </div>

      <ul class="transfer-list progress-files" data-progress-files></ul>

      <div class="action-buttons">
        <button class="cancel-button" type="button" data-action="cancel-transfer">
          Cancel
        </button>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
