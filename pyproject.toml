[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vishare-quick"
version = "0.9.0a0"
description = "Experimental Android Quick Share protocol inspection and UKEY2 foundation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "ViShare_Quick contributors" }]
dependencies = [
    "zeroconf>=0.132",
    "cryptography>=41.0",
    "pywebview>=6.0",
    "pystray>=0.19.5; sys_platform == 'win32'",
    "Pillow>=10; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
vishare = "vishare_quick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vishare_quick.ui" = ["static/*", "static/assets/*", "static/styles/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
