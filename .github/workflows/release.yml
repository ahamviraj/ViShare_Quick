name: Build and Release

on:
  push:
    tags:
      - "alpha_*"
      - "beta_*"
      - "stable_*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: vishare-quick-windows-x64
            output_file: dist/vishare-quick.exe
          - os: ubuntu-latest
            artifact_name: vishare-quick-linux-x64
            output_file: dist/vishare-quick
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Package CLI
        run: pyinstaller --clean --noconfirm --onefile --name vishare-quick --paths src src/vishare_quick/__main__.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_file }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
