name: Build and Release

on:
  push:
    tags:
      - "alpha_*"
      - "beta_*"
      - "stable_*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: vishare-quick-windows-x64
            output_file: dist/vishare-quick.exe
          # Ubuntu 22.04 is kept deliberately instead of ubuntu-latest so the
          # frozen Python and OpenSSL libs only need glibc 2.35, which keeps the
          # asset usable on current LTS distributions such as Ubuntu 22.04+ and
          # Debian 12. Building on a newer runner raises that floor.
          - os: ubuntu-22.04
            artifact_name: vishare-quick-linux-x64
            output_file: dist/vishare-quick
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Python and webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv python3-gi \
            gir1.2-webkit2-4.1 gir1.2-soup-3.0
          python3 -m venv --system-site-packages .venv-linux
          echo "$PWD/.venv-linux/bin" >> "$GITHUB_PATH"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --clean --noconfirm --onefile --name vishare-quick --icon installer/vishare-quick.ico --paths src --collect-data vishare_quick.ui --add-data "installer/vishare-quick.ico;installer" --hidden-import pystray._win32 src/vishare_quick/__main__.py
      - name: Package CLI (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --clean --noconfirm --distpath dist --workpath build installer/linux/vishare-quick.spec
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "import vishare_quick; print(vishare_quick.__version__)"
          if ($version -match '(\d+)\.(\d+)') {
            $numericVersion = "$($Matches[1]).$($Matches[2]).0.0"
          } else {
            $numericVersion = "0.0.0.0"
          }
          $iscc = @(
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found" }
          & $iscc "/DAppVersion=$version" "/DVersionInfoVersion=$numericVersion" "installer\vishare-quick.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Linux installer
        if: runner.os == 'Linux'
        run: |
          version=$(python -c "import vishare_quick; print(vishare_quick.__version__)")
          deb_version="${version#alpha_}"
          case "$deb_version" in
            *.*.*) ;;
            *.*) deb_version="$deb_version.0" ;;
            *) deb_version="$deb_version.0.0" ;;
          esac
          root="build/deb/vishare-quick"
          rm -rf "$root"
          install -Dm755 dist/vishare-quick "$root/usr/bin/vishare-quick"
          install -Dm644 installer/linux/vishare-quick.desktop "$root/usr/share/applications/vishare-quick.desktop"
          install -Dm644 installer/linux/vishare-quick.png "$root/usr/share/icons/hicolor/256x256/apps/vishare-quick.png"
          install -d "$root/DEBIAN"
          sed "s/__VERSION__/$deb_version/" installer/linux/control > "$root/DEBIAN/control"
          install -m755 installer/linux/postinst "$root/DEBIAN/postinst"
          install -m755 installer/linux/postrm "$root/DEBIAN/postrm"
          dpkg-deb --build --root-owner-group "$root" "dist/vishare-quick_${deb_version}_amd64.deb"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_file }}
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vishare-quick-windows-installer
          path: installer/output/*.exe
      - name: Upload Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vishare-quick-linux-installer
          path: dist/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release may already exist (created by hand or by an earlier run).
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
