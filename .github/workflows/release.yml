name: Build and Release

on:
  push:
    tags:
      - "alpha_*"
      - "beta_*"
      - "stable_*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: vishare-quick-windows-x64
            output_file: dist/vishare-quick.exe
          # Ubuntu 22.04 is kept deliberately instead of ubuntu-latest so the
          # frozen Python and OpenSSL libs only need glibc 2.35, which keeps the
          # asset usable on current LTS distributions such as Ubuntu 22.04+ and
          # Debian 12. Building on a newer runner raises that floor.
          - os: ubuntu-22.04
            artifact_name: vishare-quick-linux-x64
            output_file: dist/vishare-quick
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Package CLI
        run: pyinstaller --clean --noconfirm --onefile --name vishare-quick --paths src --collect-data vishare_quick.ui src/vishare_quick/__main__.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_file }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release may already exist (created by hand or by an earlier run).
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
